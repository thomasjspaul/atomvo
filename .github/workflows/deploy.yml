name: Deploy

# Runs only on pushes to main (and manual runs) — never on pull requests, so
# code from a fork can never reach the Cloudflare token.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Opt-in: forks and fresh clones skip this until DEPLOY_TARGETS is set.
    if: vars.DEPLOY_TARGETS != ''
    runs-on: ubuntu-latest
    # Put the secrets on this environment and restrict it to the main branch
    # (Settings → Environments → production → Deployment branches).
    environment: production
    strategy:
      fail-fast: false
      matrix:
        # e.g. [{"env":"","name":"Atomvo"},{"env":"alex","name":"Alex's Food"}]
        # "env" is a wrangler environment name ("" = top level), "name" the app name.
        target: ${{ fromJSON(vars.DEPLOY_TARGETS) }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_APP_NAME: ${{ matrix.target.name }}
      TARGET_ENV: ${{ matrix.target.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Write wrangler.jsonc from secret
        env:
          WRANGLER_CONFIG: ${{ secrets.WRANGLER_CONFIG }}
        run: |
          if [ -z "$WRANGLER_CONFIG" ]; then echo "WRANGLER_CONFIG secret is not set"; exit 1; fi
          printf '%s' "$WRANGLER_CONFIG" > wrangler.jsonc
          if [ -n "$TARGET_ENV" ]; then echo "CLOUDFLARE_ENV=$TARGET_ENV" >> "$GITHUB_ENV"; fi

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote

      - name: Build
        run: npm run build

      - name: Deploy Worker
        run: npx wrangler deploy
