name: Deploy

# Runs only on pushes to main (and manual runs) — never on pull requests, so
# code from a fork can never reach the Cloudflare token.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Put the secrets on this environment and restrict it to the main branch
    # (Settings → Environments → production → Deployment branches).
    environment: production
    steps:
      # Opt-in: forks and fresh clones have no DEPLOY_TARGETS secret, so they stop here.
      - name: Check deploy is configured
        id: check
        env:
          DEPLOY_TARGETS: ${{ secrets.DEPLOY_TARGETS }}
        run: |
          if [ -n "$DEPLOY_TARGETS" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"
          else echo "DEPLOY_TARGETS secret not set, skipping deploy."; fi

      - if: steps.check.outputs.enabled == 'true'
        uses: actions/checkout@v5
      - if: steps.check.outputs.enabled == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - if: steps.check.outputs.enabled == 'true'
        run: npm ci

      # Public repos have public logs, so instance names, app names and domains
      # never appear in step headers, and tool output is only shown on failure.
      - name: Migrate, build and deploy each target
        if: steps.check.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_CONFIG: ${{ secrets.WRANGLER_CONFIG }}
          # e.g. [{"env":"","name":"Atomvo"},{"env":"alex","name":"Alex's Food"}]
          # "env" is a wrangler environment name ("" = top level), "name" the app name.
          DEPLOY_TARGETS: ${{ secrets.DEPLOY_TARGETS }}
        run: |
          set -euo pipefail
          if [ -z "$WRANGLER_CONFIG" ]; then echo "WRANGLER_CONFIG secret is not set"; exit 1; fi
          printf '%s' "$WRANGLER_CONFIG" > wrangler.jsonc

          quiet() { if ! "$@" > step.log 2>&1; then cat step.log; exit 1; fi; }
          target() { node -p "JSON.parse(process.env.DEPLOY_TARGETS)[$1].$2 || ''"; }

          count=$(node -p 'JSON.parse(process.env.DEPLOY_TARGETS).length')
          for i in $(seq 0 $((count - 1))); do
            env_name=$(target "$i" env)
            app_name=$(target "$i" name)
            if [ -n "$env_name" ]; then echo "::add-mask::$env_name"; fi
            if [ -n "$app_name" ]; then echo "::add-mask::$app_name"; fi

            if [ -n "$env_name" ]; then export CLOUDFLARE_ENV="$env_name"; else unset CLOUDFLARE_ENV; fi
            export VITE_APP_NAME="$app_name"

            echo "== Target $((i + 1)) of $count"
            quiet npx wrangler d1 migrations apply DB --remote
            echo "migrations ok"
            quiet npm run build
            echo "build ok"
            quiet npx wrangler deploy
            echo "deploy ok"
            rm -rf dist
          done
